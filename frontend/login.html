<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SIWES Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <nav class="bg-white nav-shadow">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <a href="index.html" class="text-xl sm:text-2xl font-bold text-green-600 tracking-tight">SIWES Finder</a>
      <a href="register.html" class="text-sm text-green-600 hover:underline">Create account</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="bg-white w-full max-w-sm rounded-lg border border-gray-200 p-6 sm:p-8 shadow-sm">
      <h1 class="text-xl font-bold text-gray-900 text-center">Welcome back</h1>
      <p class="text-center text-gray-500 text-sm mt-1.5 mb-6">Login to your account</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Email</label>
          <input type="email" id="email" required
            class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm"
            placeholder="you@example.com">
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">Password</label>
          <input type="password" id="password" required
            class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm"
            placeholder="Your password">
        </div>

        <button type="submit" class="btn-green w-full py-2.5 rounded-md text-sm mt-2">
          Login
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-5">
        Don’t have an account?
        <a href="register.html" class="text-green-600 font-medium hover:underline">Register</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
